spring.application.name=PracticaUno

# Puerto por donde escucha nuestro servidor web
server.port=80

# Formato de salida del log
logging.pattern.dateformat=hh:mm

# Desactivar banner de Spring
spring.main.banner-mode=off

# Definir caché en falso para ver cambios en plantillas Thymeleaf inmediatamente
spring.thymeleaf.cache=false

# Conexión local a la BD practica en MySQL (activa)
spring.datasource.url=jdbc:mysql://localhost:3306/practica

# Conexión remota en Aiven.io (comentada por si se requiere en el futuro)
# spring.datasource.url=jdbc:mysql://techshop-randyms-techshop.l.aivencloud.com:18272/practica

# Credenciales de base de datos (iguales a TechShop)
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.

# Driver y dialecto Hibernate MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar y formatear consultas SQL en consola
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.type.descriptor.sql.BasicBinder=trace

# Configuración de Firebase Storage para subida de fotos
firebase.bucket.name=techshop-4f012.firebasestorage.app
firebase.storage.path=practica
firebase.json.path=firebase
firebase.json.file=techshop-4f012-firebase-adminsdk-fbsvc-84ad9b5cd0.json
