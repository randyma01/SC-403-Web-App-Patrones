<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{plantilla :: head}">
        <title>[[#{aplicacion.titulo}]]</title>
    </head>
    <body>
        <header th:replace="~{plantilla :: header}"/>

        <section class="py-5 text-center container">
            <div class="row py-lg-5">
                <div class="col-lg-6 col-md-8 mx-auto">
                    <h1 class="fw-light">[[#{aplicacion.titulo}]]</h1>
                    <p class="lead text-muted">[[#{pregunta.listado}]]</p>
                    <p>
                        <a th:href="@{/pregunta/listado}" class="btn btn-primary my-2">
                            <i class="fa-solid fa-list me-2"></i>[[#{plantilla.preguntas}]]
                        </a>
                    </p>
                </div>
            </div>
        </section>

        <footer th:replace="~{plantilla :: footer}"/>
    </body>
</html>
